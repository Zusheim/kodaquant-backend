name: Entrenamiento Semanal - KodaQuant Predictive Engine

on:
  schedule:
    - cron: '0 23 * * 5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  retrain-model:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # FIX: numpy==2.5.1 exige Python>=3.12 (root cause del build fallido).
          # 3.12 ya es el runtime real del HF Space (ver python_version en
          # sync_huggingface.yml) -- esto solo alinea train/serve parity.
          python-version: '3.12'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-3.12-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-3.12-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # torch/transformers YA están pineados en requirements.txt
          # (torch==2.11.0, transformers==5.15.0 -- ver FIX RONDA 1/2 ahí)
          # para compat con el validador ZeroGPU de HF. Instalarlos sueltos
          # acá (como antes) los sobrescribía con versiones sin pinear,
          # deshaciendo esos fixes en cada corrida de entrenamiento.
          pip install -r requirements.txt

      - name: Ejecutar script de entrenamiento
        env:
          # --- Supabase ---
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}

          # --- Stripe ---
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_PRICE_PRO: ${{ secrets.STRIPE_PRICE_PRO }}
          STRIPE_PRICE_ULTRA: ${{ secrets.STRIPE_PRICE_ULTRA }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_SUCCESS_URL: ${{ secrets.STRIPE_SUCCESS_URL }}
          STRIPE_CANCEL_URL: ${{ secrets.STRIPE_CANCEL_URL }}

          # --- Mercado / Sentimiento ---
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}

          # --- Seguridad interna ---
          API_SECRET_KEY: ${{ secrets.API_SECRET_KEY }}

          # --- SMTP ---
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}

          # --- Flags de entorno (tienen default en Settings, se fuerzan explícitos) ---
          ENV: ${{ secrets.ENV }}
          DEBUG: ${{ secrets.DEBUG }}

          # --- V9 CI/CD (Purgado Total en Producción) ---
          KODAQUANT_FORCE_FRESH_DATA: "true"
        run: python ml_engine/train_kodaquant_v5.py

      - name: Auto commit model artifacts
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 MLOps: Automated model retraining weights updated"
          file_pattern: 'services/kodaquant_models/**/*.keras services/kodaquant_models/**/*.pkl services/kodaquant_models/**/*.png'
          commit_user_name: github-actions[bot]
          commit_user_email: github-actions[bot]@users.noreply.github.com
          commit_author: github-actions[bot] <github-actions[bot]@users.noreply.github.com>

      # NUEVO: push directo a HF -- NO depende del `on: push` de
      # sync_huggingface.yml, porque el commit de arriba usa GITHUB_TOKEN y
      # GitHub NO dispara otros workflows con ese token (evita loops
      # infinitos). Sin este step, los pesos nunca llegaban a HF solos.
      - name: Publicar pesos del modelo en Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install -U "huggingface_hub[cli]"

          # Destino: mismo Space del backend (Zusheim/kodaquant-backend).
          # Ruta destino "services/kodaquant_models" (NO ".") -- preserva la
          # misma ruta relativa que usa el código en runtime (quanti_engine.py
          # espera crypto_specialist/ y equity_specialist/ ahí mismo, igual
          # que en el checkout local).
          huggingface-cli upload Zusheim/kodaquant-backend \
            services/kodaquant_models/ services/kodaquant_models \
            --repo-type space \
            --token "$HF_TOKEN" \
            --commit-message "🤖 MLOps: sync pesos entrenados $(date -u +%Y-%m-%dT%H:%M:%SZ)"