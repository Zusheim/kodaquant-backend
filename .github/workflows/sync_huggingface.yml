name: Despliegue Automático a Hugging Face

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Empujar estado limpio a Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # 1. Crear .gitignore dinámico para basura
          cat > .gitignore << EOF
          node_modules/
          venv/
          .env
          dist/
          build/
          __pycache__/
          *.pyc
          .DS_Store
          EOF          
          
          # 2. Inyectar la llave de encendido de Hugging Face
          cat > README.md << EOF
          ---
          title: KodaQuant Backend
          emoji: 🚀
          colorFrom: blue
          colorTo: indigo
          sdk: gradio
          app_file: app.py
          pinned: false
          ---
          EOF

          # 3. Borrar el historial fantasma de Git
          rm -rf .git
          git init
          git checkout -b main
          git config user.name "GitHub Actions KodaQuant"
          git config user.email "actions@github.com"
          
          # 4. Rastrear solo los archivos que existen HOY
          git lfs install
          git lfs track "*.keras"
          git lfs track "*.pkl"
          git add .
          
          # 5. Empaquetar y forzar la subida a Hugging Face
          git commit -m "deploy: inyectar motor de Hugging Face y sincronizar backend"
          git push --force https://Zusheim:$HF_TOKEN@huggingface.co/spaces/Zusheim/kodaquant-backend main