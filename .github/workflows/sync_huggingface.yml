name: Despliegue Automático a Hugging Face

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Empujar estado limpio a Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # 1. Crear .gitignore linea por linea sin sangrías
          echo "node_modules/" > .gitignore
          echo "venv/" >> .gitignore
          echo ".env" >> .gitignore
          echo "dist/" >> .gitignore
          echo "build/" >> .gitignore
          echo "__pycache__/" >> .gitignore
          echo "*.pyc" >> .gitignore
          echo ".DS_Store" >> .gitignore

          # 2. Inyectar la llave de encendido — SDK Docker, no Gradio.
          #    app.py/main.py son un servidor FastAPI puro; nunca importan
          #    gradio. Declarar sdk: gradio forzaba a HF a instalar el
          #    paquete `gradio`, que fija su propio rango de `fastapi`
          #    (gradio requiere fastapi>=0.115.2,<1.0) — de ahí el choque
          #    con fastapi==0.115.0 en requirements.txt. sdk: docker no
          #    instala gradio: el Dockerfile del repo controla el 100%
          #    del entorno de ejecución.
          echo "---" > README.md
          echo "title: KodaQuant Backend" >> README.md
          echo "emoji: 🚀" >> README.md
          echo "colorFrom: blue" >> README.md
          echo "colorTo: indigo" >> README.md
          echo "sdk: docker" >> README.md
          echo "app_port: 7860" >> README.md
          echo "pinned: false" >> README.md
          echo "---" >> README.md

          # 3. Borrar el historial fantasma de Git
          rm -rf .git
          git init
          git checkout -b main
          git config user.name "GitHub Actions KodaQuant"
          git config user.email "actions@github.com"

          # 4. Rastrear los artefactos binarios de modelos que existen HOY
          git lfs install
          git lfs track "*.keras"
          git lfs track "*.h5"
          git lfs track "*.pkl"
          git lfs track "*.joblib"
          git lfs track "*.npy"
          git lfs track "*.npz"
          git add .

          # 5. Empaquetar y forzar la subida a Hugging Face
          git commit -m "deploy: migracion a Docker SDK (fix conflicto fastapi/gradio)"
          git push --force https://Zusheim:$HF_TOKEN@huggingface.co/spaces/Zusheim/kodaquant-backend main